
<div class="row">
  <div class="col-md-3">
    <ul class="list-group">
      <li class="list-group-item {% if not categorie_active %}active{% endif %}">
        <a href="{% url 'catalogue' %}">Tous les produits</a>
      </li>
      {% for cat in categories %}
      <li class="list-group-item {% if cat.id == categorie_active %}active{% endif %}">
        <a href="{% url 'catalogue_par_categorie' cat.id %}">{{ cat.nom }}</a>
      </li>
      {% endfor %}
    </ul>
  </div>

  <div class="col-md-9">
    <div class="row">
      {% for produit in produits %}
      <div class="col-md-4 mb-4">
        <div class="card h-100 shadow-sm">
          <img src="{{ produit.img.url }}" class="card-img-top" alt="{{ produit.libelle }}">
          <div class="card-body">
            <h5 class="card-title">{{ produit.libelle }}</h5>
            <p class="card-text">{{ produit.description }}</p>
            <p class="text-muted">Prix : {{ produit.prix }} €</p>
          </div>
        </div>
      </div>
      {% empty %}
      <p>Aucun produit trouvé dans cette catégorie.</p>
      {% endfor %}
    </div>
  </div>
</div>
