{% load static %}
<!DOCTYPE html>
<html>
<head>
    <meta charset='utf-8'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <title>
        {% block title %}{% endblock %}
    </title>
    <link rel='stylesheet' type='text/css' media='screen'
          href="{% static 'css/base.css' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    {% block styles %}{% endblock %}
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="{% url 'index' %}">Myshop</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" 
                    data-bs-target="#navbarNav" aria-controls="navbarNav" 
                    aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'catalogue' %}">Catalogue</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'fournisseur' %}">Fournisseur</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'produit' %}">Produit</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'administration' %}">Administration</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div id="conteneur">
        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
